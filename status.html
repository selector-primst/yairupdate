<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yair 冷库冷量计算 · 更新中心</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  body{background:linear-gradient(160deg,#0f172a,#1a2438);color:#e2e8f0;min-height:100vh;padding:24px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:24px;text-align:center;padding:20px 0 6px;
     background:linear-gradient(90deg,#38bdf8,#22d3ee,#4ade80);
     -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
  .sub{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:22px}
  .card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px 22px;margin-bottom:16px}
  .card h2{font-size:15px;color:#38bdf8;margin-bottom:14px;font-weight:600}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed #334155;font-size:14px}
  .row:last-child{border-bottom:none}
  .k{color:#94a3b8}
  .v{font-weight:700;color:#4ade80}
  .v.gray{color:#e2e8f0}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:#4ade80;margin-top:14px;
          background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.35);border-radius:20px;
          padding:8px 16px;justify-content:center}
  .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
  .tip{color:#94a3b8;font-size:12px;line-height:1.9;margin-top:8px}
  .tip b{color:#fbbf24}
  .btn{display:inline-block;margin-top:6px;background:linear-gradient(90deg,#1e6fd6,#22d3ee);
       color:#fff;text-decoration:none;padding:10px 22px;border-radius:22px;font-size:14px;font-weight:600}
  code{background:#0f172a;padding:2px 8px;border-radius:6px;color:#38bdf8;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Yair 冷库冷量计算</h1>
  <div class="sub">更新中心 · 状态总览</div>

  <div class="card" id="mainCard">
    <h2>当前发布版本</h2>
    <div class="row"><span class="k">页面版本 pageVersion</span><span class="v" id="pv">加载中…</span></div>
    <div class="row"><span class="k">程序版本 appVersion</span><span class="v" id="av">加载中…</span></div>
    <div class="row"><span class="k">发布日期</span><span class="v gray" id="rd">—</span></div>
    <div class="row"><span class="k">程序下载地址</span><span class="v gray" id="au" style="font-size:12px;max-width:60%;text-align:right;word-break:break-all">—</span></div>
    <div class="status"><span class="dot"></span><span id="statusText">更新中心运行正常</span></div>
  </div>

  <div class="card">
    <h2>说明</h2>
    <div class="tip">
      本页面用于<b>人工查看</b>更新中心状态。<br>
      软件（电脑版 / 手机版）会自动读取后台的 <code>version.json</code> 数据文件，
      发现新版本时自动提示或下载。<br>
      直接访问 <code>version.json</code> 时浏览器可能显示空白或下载文件，
      这是<b>正常现象</b>（JSON 是给程序读的数据，不是网页）。
    </div>
    <div style="text-align:center">
      <a class="btn" href="version.json" target="_blank">查看原始 version.json</a>
    </div>
  </div>
</div>

<script>
(function(){
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'version.json?t=' + Date.now(), true);
  xhr.onreadystatechange = function(){
    if (xhr.readyState !== 4) return;
    var pv = document.getElementById('pv'), av = document.getElementById('av');
    if (xhr.status !== 200) {
      pv.textContent = '读取失败'; av.textContent = '读取失败';
      document.getElementById('statusText').textContent = '无法读取 version.json';
      return;
    }
    try {
      var d = JSON.parse(xhr.responseText);
      pv.textContent = 'v' + (d.pageVersion || '—');
      av.textContent = 'v' + (d.appVersion || '—');
      if (d.releaseDate) document.getElementById('rd').textContent = d.releaseDate;
      if (d.appUrl) document.getElementById('au').textContent = d.appUrl;
    } catch (e) {
      pv.textContent = '数据格式错误'; av.textContent = '—';
    }
  };
  xhr.send(null);
})();
</script>
</body>
</html>
